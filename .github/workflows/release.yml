# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

# release-please keeps a release pull request open on `main` (release-please-config.json). Merging
# it creates the `v<version>` tag and a draft release; this run then builds the linux amd64 and
# arm64 binaries, checks each on its architecture, and publishes the release with checksums, an
# SBOM, a Sigstore signature and attestations. The draft stays unpublished unless every check
# passed.
#
# In the same run because the tag is pushed with GITHUB_TOKEN, which triggers no workflow.
name: release

on:
  push:
    branches:
      - main

# Never cancel a run: it may hold a draft release half published.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # the tag, the draft release, the release branch
      issues: write # the autorelease labels
      pull-requests: write # the release pull request
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.body }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      # No cache on purpose: a release must not build from state a pull request could write.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: make tidy-check vet test dist VERSION="$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  check:
    needs: [release-please, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, arch: amd64 }
          - { runner: ubuntu-26.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The fixtures.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/dist
      - name: Run the binary
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          bin="$RUNNER_TEMP/dist/ignition-converter_${VERSION}_linux_${ARCH}"
          # Artifacts lose the mode bits.
          chmod +x "$bin"
          "$bin" --version | grep -Fx "ignition-converter $VERSION"
          "$bin" --convert < cmd/ignition-converter/testdata/kubeadm-join.json | jq -e '.ignition.version == "3.0.0"'

  # The only job that can write the release or request an OIDC token, so one identity (this
  # workflow on main) signs and attests every asset.
  publish:
    needs: [release-please, check]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # upload to and publish the draft release
      id-token: write # keyless Sigstore signing
      attestations: write # provenance and SBOM attestations
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/assets

      # From a binary's build info: the modules linked in, not go.sum's test dependencies. One
      # SBOM covers both binaries, built from the same source.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ runner.temp }}/assets/ignition-converter_${{ env.VERSION }}_linux_amd64
          format: spdx-json
          output-file: ${{ runner.temp }}/assets/ignition-converter_${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: |
          sha256sum -- ignition-converter_* > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" = 3 ]

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # SHA256SUMS lists every other asset, so one signature covers them all.
      - name: Sign SHA256SUMS
        working-directory: ${{ runner.temp }}/assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/ignition-converter_${{ env.VERSION }}_linux_*
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/ignition-converter_${{ env.VERSION }}_linux_*
          sbom-path: ${{ runner.temp }}/assets/ignition-converter_${{ env.VERSION }}.spdx.json

      # release-please's notes, then how to verify the assets.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.release-please.outputs.notes }}
        run: |
          {
            echo "$NOTES"
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo "gh attestation verify <file> --repo $GH_REPO"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity https://github.com/$GITHUB_WORKFLOW_REF \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/*
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
